[project]
name = "letsgo"
version = "0.1.0"
description = "Multi-agent travel planning system with a first-class evaluation layer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.60",
    "anthropic>=0.40.0",
    "groq>=0.13.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
