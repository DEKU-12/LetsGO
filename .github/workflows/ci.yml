# No secrets here on purpose: with no API keys every adapter and the model run
# in mock mode, so CI checks that the graph, API, checks and eval scripts work
# end to end. It does not measure plan quality — real-model evals cost money
# and run by hand (see README → Evaluation results).
name: CI

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --extra dev
      - run: uv run pytest -q
      - name: Eval scripts run end to end (mock model)
        run: |
          uv run python -m eval.run --provider mock --no-save
          uv run python -m eval.tools --provider mock
          uv run python -m eval.edits --provider mock
          uv run python -m eval.preferences --provider mock

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
